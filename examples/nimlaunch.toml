# NimLaunch example configuration
#
# Install:   mkdir -p ~/.config/nimlaunch && cp examples/nimlaunch.toml ~/.config/nimlaunch/
# Scripts:   mkdir -p ~/.config/nimlaunch/scripts && cp examples/scripts/*.sh ~/.config/nimlaunch/scripts/
#
# Every key is optional; anything you delete falls back to its default.
# Colours are "#RRGGBB". Restart NimLaunch after editing.
# Reference: docs/configuration.md, docs/groups-and-shortcuts.md, docs/dmenu.md.

# ── Window ──────────────────────────────────────────────────────────────────

[window]
width = 560                    # pixels
line_height = 22               # minimum row height in pixels (12 - 200)
show_clock = true              # false hides the clock
opacity = 1.0                  # 0.1 - 1.0; some compositors ignore it
max_visible_items = 8          # rows shown before the list scrolls
center = true                  # false: use position_x / position_y instead
vertical_align = "one-third"   # when centred: "top", "center" or "one-third"
display = 0                    # monitor index when centred

[font]
fontname = "Noto Sans:size=15" # fontconfig-style "Family:size=N"

[input]
prompt = "> "
cursor = "_"
vim_mode = false               # true: Esc / hjkl navigation

[terminal]
program = "kitty"              # used by :r, ! and terminal-mode shortcuts

[border]
width = 2                      # 0 removes the border

[icons]
enabled = true

# ── Groups ──────────────────────────────────────────────────────────────────
# A group used by a shortcut below is created automatically in "filter" mode:
# `:sys re` narrows the group to entries matching "re". A [[groups]] block is
# only needed for "pass" mode, where the text after the group is handed to the
# chosen shortcut as {query} instead of filtering the list.

[[groups]]
name = "svc"
query_mode = "pass"

# ── Prefix shortcuts (mode = "url" is the default) ──────────────────────────
# `:g nim language` opens the search in your browser. {query} is percent-encoded
# for URLs; without {query} the text is appended to `base`.

[[shortcuts]]
prefix = ":g"
label  = "Search Google: "
base   = "https://www.google.com/search?q={query}"

[[shortcuts]]
prefix = ":w"
label  = "Search Wikipedia: "
base   = "https://en.wikipedia.org/wiki/Special:Search?search={query}"

[[shortcuts]]
prefix = ":aur"
label  = "Search the AUR: "
base   = "https://aur.archlinux.org/packages?K={query}"

[[shortcuts]]
prefix = ":gh"
label  = "Search GitHub: "
base   = "https://github.com/search?q={query}&type=repositories"

# ── Shell shortcuts ─────────────────────────────────────────────────────────
# {query} is shell-quoted for you: never wrap it in quotes yourself.

# run_mode = "spawn" runs in the background, no terminal window.
# `:n buy milk` appends a line to ~/quick-notes.txt.
[[shortcuts]]
prefix   = ":n"
label    = "Quick note: "
base     = "echo {query} >> ~/quick-notes.txt"
mode     = "shell"
run_mode = "spawn"

# The default run_mode = "terminal" opens the command in [terminal] program.
# `:ssh myserver` connects in a new terminal.
[[shortcuts]]
prefix = ":ssh"
label  = "SSH to: "
base   = "ssh {query}"
mode   = "shell"

# The script takes the expression as arguments: `:calc 2*(3+4)`.
[[shortcuts]]
prefix   = ":calc"
label    = "Calculate: "
base     = "bash ~/.config/nimlaunch/scripts/nimlaunch_calculator.sh {query}"
mode     = "shell"
run_mode = "spawn"

# ── File shortcuts ──────────────────────────────────────────────────────────
# mode = "file" opens a path with the default handler. `:dl report.pdf`
[[shortcuts]]
prefix = ":dl"
label  = "Open from Downloads: "
base   = "~/Downloads/{query}"
mode   = "file"

# ── Group: sys (filter) ─────────────────────────────────────────────────────
# Type `:sys`, then a few letters. The power menu script asks before it
# reboots or shuts down, so those are left to it.

[[shortcuts]]
group    = "sys"
label    = "Lock"
base     = "loginctl lock-session"
mode     = "shell"
run_mode = "spawn"

[[shortcuts]]
group    = "sys"
label    = "Suspend"
base     = "systemctl suspend"
mode     = "shell"
run_mode = "spawn"

[[shortcuts]]
group    = "sys"
label    = "Power Menu"
base     = "bash ~/.config/nimlaunch/scripts/nimlaunch_power.sh"
mode     = "shell"
run_mode = "spawn"

# ── Group: media (filter, stay_open) ────────────────────────────────────────
# stay_open = true keeps NimLaunch open after the action, so you can press
# Enter again and again to step the volume.

[[shortcuts]]
group     = "media"
label     = "Volume up"
base      = "wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+"
mode      = "shell"
run_mode  = "spawn"
stay_open = true

[[shortcuts]]
group     = "media"
label     = "Volume down"
base      = "wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-"
mode      = "shell"
run_mode  = "spawn"
stay_open = true

[[shortcuts]]
group    = "media"
label    = "Mute toggle"
base     = "wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle"
mode     = "shell"
run_mode = "spawn"

# ── Group: svc (pass) ───────────────────────────────────────────────────────
# `:svc sshd` lists these actions with "sshd" filled in; pick one to run it.

[[shortcuts]]
group = "svc"
label = "systemctl status: "
base  = "systemctl status {query}"
mode  = "shell"

[[shortcuts]]
group = "svc"
label = "journalctl this boot: "
base  = "journalctl -u {query} -b"
mode  = "shell"

[[shortcuts]]
group = "svc"
label = "systemctl cat: "
base  = "systemctl cat {query}"
mode  = "shell"

# ── Group: proj (filter, file mode) ─────────────────────────────────────────

[[shortcuts]]
group = "proj"
label = "NimLaunch"
base  = "~/Projects/NimLaunch"
mode  = "file"

[[shortcuts]]
group = "proj"
label = "Dotfiles"
base  = "~/.config"
mode  = "file"

# ── Group: ss (screenshots, filter) ─────────────────────────────────────────
# The script's menu is below under "scripts"; these skip the menu.

[[shortcuts]]
group    = "ss"
label    = "Area to clipboard"
base     = "bash ~/.config/nimlaunch/scripts/nimlaunch_screenshot.sh area clipboard"
mode     = "shell"
run_mode = "spawn"

[[shortcuts]]
group    = "ss"
label    = "Full screen to file"
base     = "bash ~/.config/nimlaunch/scripts/nimlaunch_screenshot.sh full file"
mode     = "shell"
run_mode = "spawn"

# ── Group: scripts (dmenu integrations) ─────────────────────────────────────
# Each script opens its own NimLaunch menu through `nimlaunch --dmenu`.
# Copy them first (see the top of this file); each one lists its dependencies.
# Type `:scripts` for the whole list. See docs/dmenu.md and examples/README.md.

[[shortcuts]]
group    = "scripts"
label    = "dmenu Showcase"
base     = "bash ~/.config/nimlaunch/scripts/nimlaunch_showcase.sh"
mode     = "shell"
run_mode = "spawn"

[[shortcuts]]
group    = "scripts"
label    = "Audio Output"
base     = "bash ~/.config/nimlaunch/scripts/nimlaunch_audio.sh"
mode     = "shell"
run_mode = "spawn"

[[shortcuts]]
group    = "scripts"
label    = "Bluetooth"
base     = "bash ~/.config/nimlaunch/scripts/nimlaunch_bluetooth.sh"
mode     = "shell"
run_mode = "spawn"

[[shortcuts]]
group    = "scripts"
label    = "Calculator"
base     = "bash ~/.config/nimlaunch/scripts/nimlaunch_calculator.sh"
mode     = "shell"
run_mode = "spawn"

[[shortcuts]]
group    = "scripts"
label    = "Clipboard History"
base     = "bash ~/.config/nimlaunch/scripts/nimlaunch_clipboard.sh"
mode     = "shell"
run_mode = "spawn"

[[shortcuts]]
group    = "scripts"
label    = "Screenshot"
base     = "bash ~/.config/nimlaunch/scripts/nimlaunch_screenshot.sh"
mode     = "shell"
run_mode = "spawn"

[[shortcuts]]
group    = "scripts"
label    = "Steam Games"
base     = "bash ~/.config/nimlaunch/scripts/nimlaunch_steam.sh"
mode     = "shell"
run_mode = "spawn"

[[shortcuts]]
group    = "scripts"
label    = "Wi-Fi"
base     = "bash ~/.config/nimlaunch/scripts/nimlaunch_wifi.sh"
mode     = "shell"
run_mode = "spawn"

[[shortcuts]]
group    = "scripts"
label    = "Window Switcher"
base     = "bash ~/.config/nimlaunch/scripts/nimlaunch_windows.sh"
mode     = "shell"
run_mode = "spawn"

# ── Themes ──────────────────────────────────────────────────────────────────
# 84 themes are built in: browse them with `:t` or `nimlaunch --list-themes`.
# A [[themes]] block adds a theme, or replaces a built-in one of the same name.
#
# [[themes]]
# name                = "My Theme"
# bgColorHex          = "#111111"   # window background
# fgColorHex          = "#f0f0f0"   # normal text
# highlightBgColorHex = "#2a2a2a"   # selected row background
# highlightFgColorHex = "#ffffff"   # selected row text
# borderColorHex      = "#555555"
# matchFgColorHex     = "#ff8c42"   # matched characters (optional)
